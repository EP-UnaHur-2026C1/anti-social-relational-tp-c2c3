version: '3.8'

services:
  db:
    image: postgres:15
    container_name: unahur_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: unahur_db
    ports:
      - "5432:5432"
    volumes:
      - unahur_pgdata:/var/lib/postgresql/data

volumes:
  unahur_pgdata: